name: Test and Build

on:
  push:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Nexora.sln

      - name: Run unit tests
        run: dotnet test tests/Core.Tests -c Release --no-restore

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.rid }}-

      # Windows Defender real-time scanning noticeably slows down restore/build.
      - name: Exclude workspace from Defender scanning (Windows)
        if: runner.os == 'Windows'
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"
        shell: powershell

      # Native AOT publish on Linux needs clang + zlib headers.
      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # Build for Windows
      - name: Run Windows build script
        if: runner.os == 'Windows'
        run: ./Publish.ps1 -Rid ${{ matrix.rid }}
        shell: powershell

      # Build for Linux and OSX
      - name: Run Linux/macOS build script
        if: runner.os != 'Windows'
        run: |
          chmod +x ./publish.sh
          ./publish.sh ${{ matrix.rid }}

      # Upload artifacts
      - name: Upload build artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-${{ matrix.rid }}
          path: src/Nexora/bin/Release/net10.0/${{ matrix.rid }}/publish/Nexora.exe
          if-no-files-found: error

      - name: Upload build artifact (Linux / macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-${{ matrix.rid }}
          path: src/Nexora/bin/Release/net10.0/${{ matrix.rid }}/publish/Nexora
          if-no-files-found: error
    