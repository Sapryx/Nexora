name: Test and Build

on:
  push:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Nexora.sln

      - name: Run unit tests
        run: dotnet test Core.Tests -c Release --no-restore

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Native AOT publish on Linux needs clang + zlib headers.
      # Windows and macOS runners already ship the required toolchains.
      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Restore dependencies
        run: dotnet restore Gui -r ${{ matrix.rid }}

      - name: Publish (AOT)
        run: dotnet publish Gui -c Release -p:PublishAot=true -r ${{ matrix.rid }} --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-${{ matrix.rid }}
          path: Gui/bin/Release/**/publish/**
          if-no-files-found: error