name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  guard:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Tag must be a release version on master
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a release version (expected x.y.z)." >&2
            exit 1
          fi

          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_REF_NAME" origin/master; then
            echo "Tag '$GITHUB_REF_NAME' is not on master." >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Exclude workspace from Defender scanning (Windows)
        if: runner.os == 'Windows'
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"
        shell: pwsh

      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Run Windows build script
        if: runner.os == 'Windows'
        run: ./scripts/Publish.ps1 -Rid ${{ matrix.rid }}
        shell: pwsh

      - name: Run Linux build script
        if: runner.os != 'Windows'
        run: |
          chmod +x ./scripts/publish.sh
          ./scripts/publish.sh ${{ matrix.rid }}

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "src/Nexora/bin/Release/net10.0/${{ matrix.rid }}/publish/*" `
            -DestinationPath "Nexora-${{ matrix.rid }}.zip"

      - name: Package artifact (Linux)
        if: runner.os != 'Windows'
        run: |
          tar -czvf "Nexora-${{ matrix.rid }}.tar.gz" \
            -C "src/Nexora/bin/Release/net10.0/${{ matrix.rid }}/publish" .

      - name: Upload asset to release (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: Nexora-${{ matrix.rid }}.zip
          generate_release_notes: true

      - name: Upload asset to release (Linux)
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: Nexora-${{ matrix.rid }}.tar.gz
          generate_release_notes: true

  aur:
    name: Publish to AUR
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Update pkgver in PKGBUILD
        run: |
          VERSION="${{ github.ref_name }}"
          sed -i "s/^pkgver=.*/pkgver=\"${VERSION}\"/" packaging/aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: nexora
          pkgbuild: ./packaging/aur/PKGBUILD
          assets: |
            packaging/aur/nexora
            packaging/aur/nexora.desktop
          updpkgsums: true
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

  winget:
    name: Publish to winget
    needs: build
    runs-on: windows-latest
    steps:
      - name: Submit package to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Nexora-win-x64.zip"

          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update Sapryx.Nexora --version ${{ github.ref_name }} --urls "$installerUrl" --submit --token $env:WINGET_TOKEN
